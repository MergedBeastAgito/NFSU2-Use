<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>fixture: no toggle</title>
		<style>
			body {
				font: 16px system-ui;
				margin: 24px;
			}
			#composer {
				border: 1px solid #888;
				width: 480px;
				min-height: 24px;
				padding: 8px;
			}
			#submit {
				margin-top: 8px;
				padding: 6px 14px;
			}
			.break-words {
				margin-top: 16px;
			}
		</style>
	</head>
	<body>
		<h1>fixture: no toggle</h1>
		<div contenteditable="true" id="composer"></div>
		<button aria-label="submit" disabled id="submit">Submit</button>
		<div class="break-words" id="answer"></div>
		<script>
			const Composer = document.getElementById("composer");
			const Submit = document.getElementById("submit");
			const Answer = document.getElementById("answer");
			Composer.addEventListener("input", () => {
				Submit.disabled = Composer.innerText.trim().length === 0;
			});
			Submit.addEventListener("click", () => {
				Answer.textContent = Composer.innerText;
				Composer.innerText = "";
				Submit.disabled = true;
			});
		</script>
	</body>
</html>
