[package]
name = "nfsu-driver"
version = "0.1.0"
edition = "2024"
publish = false
description = "Drives the NFSU2 browser port from its own memory, through Agentic's browser port."
build = "build.rs"

# The layout is Agentic's: a library named Agentic<Name> under Source/, a thin
# binary beside it, and one expression per file under Source/Script.
[lib]
name = "AgenticNfsuDriver"
path = "Source/Library.rs"

[[bin]]
name = "nfsu-driver"
path = "Source/Main.rs"

# The facade is what a consumer names, and it is consumed as-is, never modified.
# The path is relative, and it is the one assumption this crate makes about
# where it sits: Agentic is checked out in the directory that holds the
# directory holding this repository. A clone that puts it elsewhere edits this
# line or passes `--config`; nothing here names a machine.
#
# Two dependencies from this tree, and no internal package beside them - not
# even for the `script!` macro this crate's expressions are baked with. The
# macro comes through the facade (`pub use AgenticRuntime::script;`), which is
# what makes the facade a facade: a consumer that had to name `agentic-runtime`
# for one macro would still be pinned to the workspace's internal crate names.
#
# `agentic-lane` is the one crate the facade deliberately does not carry: it
# re-exports the ports a consumer's browsing flow needs, and
# `agentic.lane.decide` is named in `Crate/Sdk/Source/Library.rs` as
# deliberately left out. A consumer that drives a decision model therefore
# names the crate itself, from a path that sits beside the facade's.
[dependencies]
agentic-sdk = { path = "../../../../Agentic/Crate/Sdk" }
agentic-lane = { path = "../../../../Agentic/Crate/Lane" }
tokio = { version = "1", features = [
	"rt-multi-thread",
	"macros",
	"time",
	"signal"
] }
serde_json = "1"

# The policy, the parser and the meter are pure, so they are tested without a
# browser: `cargo test` runs them and never attaches to anything.
[[test]]
name = "decision"
path = "Test/Decision.rs"

# The port's own test: the adapter is constructed over a scripted page, held as
# `Arc<dyn Adapter>`, and asked whether it serves the port its manifest declares.
# No browser, no game, no network - the value is what is under test.
[[test]]
name = "adapter"
path = "Test/Adapter.rs"
